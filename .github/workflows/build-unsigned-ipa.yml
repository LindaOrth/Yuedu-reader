name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Create CI Firebase placeholder
        run: |
          cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>disabled</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.codex.yuedureader</string>
            <key>PROJECT_ID</key>
            <string>codex-yuedu-disabled</string>
            <key>STORAGE_BUCKET</key>
            <string>codex-yuedu-disabled.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <false/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          PLIST

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader

      - name: Archive unsigned app
        run: |
          xcodebuild archive \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YueduReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            GATEWAY_BASE_URL="" \
            GIT_COMMIT_SHA="$GITHUB_SHA"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/YueduReader.xcarchive/Products/Applications/YueduReader.app"
          test -d "$APP_PATH"
          # This build has no provisioning profile, so CloudKit/iCloud cannot
          # work in it. Stamp the app so BuildCapabilities keeps those services
          # inert instead of trapping inside CKContainer at launch.
          /usr/libexec/PlistBuddy -c "Add :YueduUnsignedBuild bool true" "$APP_PATH/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Set :YueduUnsignedBuild true" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :YueduUnsignedBuild" "$APP_PATH/Info.plist"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry YueduReader-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned-ipa
          path: ${{ runner.temp }}/YueduReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
